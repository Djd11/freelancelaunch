{% extends "base.html" %}
{% block title %}Profile — FreelanceLaunch{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-12">
    <h1 class="text-2xl font-bold mb-8">Your Profile</h1>
    
    <div class="bg-white rounded-2xl border border-gray-200 p-6 mb-8">
        <h2 class="font-semibold text-lg mb-4">Account Details</h2>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Display Name</label>
                <input type="text" name="display_name" value="{{ profile.get('display_name', '') }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" value="{{ user.get('email', '') }}" disabled class="w-full px-4 py-2 border border-gray-200 rounded-lg bg-gray-50 text-gray-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Current Tier</label>
                <span class="inline-block px-3 py-1 rounded-full text-xs font-semibold 
                    {% if profile.get('tier') == 'placement' %}bg-purple-100 text-purple-700
                    {% elif profile.get('tier') == 'guided' %}bg-blue-100 text-blue-700
                    {% else %}bg-gray-100 text-gray-700{% endif %}">
                    {{ profile.get('tier', 'free')|capitalize }}
                </span>
            </div>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Save</button>
        </form>
    </div>
</div>
{% endblock %}
