{% extends "base.html" %}
{% block title %}Sign Up — FreelanceLaunch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">Start Your <span class="gradient-text">Freelance Journey</span></h1>
            <p class="text-gray-500 mt-2">Free forever. No credit card needed.</p>
        </div>
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                    <input type="text" name="name" placeholder="Your name" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                {% if request.args.get('topic') %}
                <input type="hidden" name="topic" value="{{ request.args.get('topic') }}">
                {% endif %}
                <button type="submit" class="w-full bg-gradient-primary text-white py-2.5 rounded-lg font-semibold hover:opacity-90 transition">
                    Create Free Account
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-blue-600 font-medium hover:underline">Login</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
