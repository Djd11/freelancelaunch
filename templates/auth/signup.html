{% extends "base.html" %}
{% block title %}Sign Up — FreelanceLaunch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Start your <span class="gradient-text">freelance journey</span></h1>
            <p class="text-gray-500 mt-2">Free forever. No credit card needed.</p>
        </div>
        <div class="card p-8">
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Name</label>
                    <input type="text" name="name" required placeholder="Your name" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" required minlength="6" placeholder="At least 6 characters" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>
                {% if request.args.get('topic') %}
                <input type="hidden" name="topic" value="{{ request.args.get('topic') }}">
                {% endif %}
                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-sm">
                    Create Free Account
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Already have an account? <a href="{{ url_for('auth.login') }}" class="text-indigo-600 font-medium hover:underline">Sign in</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
