{% extends "base.html" %}
{% block title %}Login — FreelanceLaunch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold">Welcome <span class="gradient-text">Back</span></h1>
            <p class="text-gray-500 mt-2">Continue your freelance journey</p>
        </div>
        <div class="bg-white p-8 rounded-2xl border border-gray-200 shadow-sm">
            <form method="POST" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" name="password" required placeholder="Your password" class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-gradient-primary text-white py-2.5 rounded-lg font-semibold hover:opacity-90 transition">
                    Login
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-blue-600 font-medium hover:underline">Sign up</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
