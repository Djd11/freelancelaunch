{% extends "base.html" %}
{% block title %}Sign In — FreelanceLaunch{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-20 px-4">
    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight">Welcome <span class="gradient-text">back</span></h1>
            <p class="text-gray-500 mt-2">Continue your freelance journey</p>
        </div>
        <div class="card p-8">
            <form method="POST" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
                    <input type="email" name="email" required placeholder="you@example.com" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input type="password" name="password" required placeholder="Your password" class="w-full px-4 py-2.5 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition text-sm">
                </div>
                <button type="submit" class="btn-primary w-full py-3 rounded-xl font-semibold text-sm">
                    Sign In
                </button>
            </form>
            <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account? <a href="{{ url_for('auth.signup') }}" class="text-indigo-600 font-medium hover:underline">Create one</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
