{% extends "base.html" %}
{% block title %}Submit Work — FreelanceLaunch{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <a href="{{ url_for('dashboard.home') }}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">← Back to Dashboard</a>
    
    <div class="bg-white rounded-2xl border border-gray-200 p-8">
        <h1 class="text-2xl font-bold mb-6">Submit Your Work</h1>
        
        <form method="POST" class="space-y-4">
            <input type="hidden" name="day_number" value="{{ day or '' }}">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Day Number</label>
                <input type="number" name="day_number" value="{{ day or '' }}" min="1" max="60" required
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Type</label>
                <select name="type" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <option value="blog">Blog Post / Article</option>
                    <option value="code">Code / Script</option>
                    <option value="proposal">Proposal</option>
                    <option value="screenshot">Screenshot</option>
                    <option value="other" selected>Other</option>
                </select>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Title</label>
                <input type="text" name="title" placeholder="e.g., Day 5 Web Scraper Script"
                       class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Your Work</label>
                <textarea name="content" rows="10" placeholder="Paste your work here (code, writing, notes)..."
                          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
                Submit for Portfolio
            </button>
        </form>
    </div>
</div>
{% endblock %}
