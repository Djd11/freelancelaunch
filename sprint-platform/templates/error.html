<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ code }}</title>
</head>
<body style="font-family: system-ui, -apple-system, sans-serif; max-width: 540px; margin: 12vh auto; padding: 0 16px; color: #222;">
  <h1 style="font-size: 44px; margin: 0 0 8px;">{{ code }}</h1>
  <p style="font-size: 18px; margin: 0 0 16px;">{{ message }}</p>
  {% if ref %}
  <p style="color: #666; font-size: 14px;">Reference: <code>{{ ref }}</code></p>
  {% endif %}
  <p style="color: #666; font-size: 14px;">If this keeps happening, contact support with the reference above.</p>
</body>
</html>
