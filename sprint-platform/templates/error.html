<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Error {{ code }}</title>
</head>
<body style="font-family: 'DM Serif Display', Georgia, serif; max-width: 540px; margin: 12vh auto; padding: 0 16px; color: #0f172a; background: #fafaf9;">
  <p style="font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #57534e; margin: 0 0 8px;">Site error</p>
  <h1 style="font-size: 88px; font-weight: 400; line-height: 1.05; letter-spacing: -.01em; margin: 0 0 8px; color: #0f172a;">{{ code }}</h1>
  <p style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 18px; margin: 0 0 16px; line-height: 1.5;">{{ message }}</p>
  {% if ref %}
  <p style="font-family: 'JetBrains Mono', ui-monospace, 'SF Mono', monospace; font-size: 13px; color: #57534e; margin: 0 0 8px;">Reference: <code style="border: 1px solid #d6d3d1; border-radius: 6px; padding: 2px 6px; background: #ffffff;">{{ ref }}</code></p>
  <p style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; color: #57534e; margin: 0;">If this keeps happening, contact support with the reference above.</p>
  {% else %}
  <p style="font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; color: #57534e; margin: 0;">If this keeps happening, contact support.</p>
  {% endif %}
</body>
</html>
