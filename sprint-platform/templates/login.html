{% extends "base.html" %}
{% block content %}
<section class="screen" id="login">
  <div class="wrap" style="max-width:440px;padding-top:72px">
    <p class="xs" style="text-align:center;margin-bottom:28px"><a class="logo" href="/">Freelance<em>Launch</em></a></p>
    <div class="card" style="padding:30px">
      <h2 style="font-size:24px;text-align:center">Sign in to your sprints</h2>
      <p class="small muted" style="text-align:center;margin:8px 0 22px">Enter the email you signed up with.</p>
      <form method="post" action="/auth/login">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email">
        </div>
        <button class="btn btn-p" type="submit" style="width:100%">Sign in →</button>
      </form>
      <div class="divider"></div>
      <p class="xs muted" style="text-align:center">New here? <a href="/" style="color:var(--accent-ink);font-weight:600">See how the 14-day sprint works</a></p>
    </div>
  </div>
</section>
{% endblock %}
