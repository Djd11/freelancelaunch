services:
  - type: web
    name: sprint-platform
    runtime: python3
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn wsgi:app"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        value: "https://freelancelaunch.onrender.com"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LLM_API_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      # Only Google and X are enabled in Supabase so far; rendering the
      # Facebook button would just surface "Social sign-in didn't complete".
      # Flip this to "google,facebook,x" once Meta app review passes.
      # NOTE: slug must match the dashboard card — "x" (OAuth 2.0), not the
      # deprecated "twitter" (OAuth 1.0a) — or GoTrue rejects the authorize.
      - key: OAUTH_PROVIDERS
        value: "google,x"
    healthCheckPath: /health